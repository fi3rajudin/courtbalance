spring.application.name=badminton-settlement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/badminton}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.bootstrap.owner-username=${BOOTSTRAP_OWNER_USERNAME:}
app.bootstrap.owner-password=${BOOTSTRAP_OWNER_PASSWORD:}
app.storage.supabase-url=${SUPABASE_URL:}
app.storage.supabase-service-key=${SUPABASE_SERVICE_KEY:}
app.storage.qr-bucket=${SUPABASE_QR_BUCKET:member-qr}
