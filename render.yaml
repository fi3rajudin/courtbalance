services:
  - type: web
    name: badminton-settlement
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BOOTSTRAP_OWNER_USERNAME
        sync: false
      - key: BOOTSTRAP_OWNER_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_QR_BUCKET
        value: member-qr
